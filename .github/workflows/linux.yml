name: Linux

on:
  push:
    branches: [main, popos-ubuntu-24.04]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Testar e analisar
        run: |
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local go vet ./...
      - name: Compilar Linux
        run: |
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -o build/discord-golive-bypass .
      - name: Validar scripts de distribuição
        run: |
          bash -n fedora/build.sh fedora/install.sh
          bash -n ubuntu/build.sh ubuntu/install.sh ubuntu/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: discord-golive-bypass-linux-amd64
          path: build/discord-golive-bypass
