name: Pop!_OS 24.04

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Testes e análise estática
        run: |
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local go vet ./...
      - name: Compilar
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -o build/discord-golive-bypass .
      - name: Validar scripts Pop!_OS
        run: bash -n popos/build.sh popos/install.sh popos/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: discord-golive-bypass-popos-24.04-amd64
          path: build/discord-golive-bypass
